# Browser setup with Docker-managed storage; no local credential files needed.
services:
  synolistbridge:
    build: .
    image: synolistbridge:local
    command: [start]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 60s
    environment:
      BRIDGE_CONFIG: /data/config.json
    ports:
      - "8765:8765"
    volumes:
      - bridge_data:/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: [CMD, python, -m, synolistbridge, health]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
volumes:
  bridge_data:
